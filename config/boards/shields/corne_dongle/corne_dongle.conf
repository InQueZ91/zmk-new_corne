# Phase 1: dongle = BLE central for both halves + USB HID keyboard. No display yet.

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Both halves' battery levels (for the future display)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# The dongle is USB powered: never sleep
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Same features the keymap relies on (copied from config/eyelash_corne.conf)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Placeholder encoder driver (gives the left half's encoder a sensor slot)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
