# Phase 1: dongle = BLE central for both halves + USB HID keyboard. No display yet.

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Both halves' battery levels (for the future display)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# The dongle is USB powered: never sleep
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Same features the keymap relies on (copied from config/eyelash_corne.conf)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# --- Display (phase 2): ST7735S 160x80, stock ZMK status screen ---
CONFIG_SPI=y
CONFIG_ZMK_DISPLAY=y
# Custom 160x128 screen from this repo (src/dongle_screen, Kconfig at repo root)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_CORNE_DONGLE_SCREEN=y
# RGB565, byte-swapped for the ST7735's big-endian SPI pixel order
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y
# Render buffer: 25% of the screen per flush; extra LVGL heap for colour theme
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# --- Stability (screen froze white + both halves dropped at the same moment) ---
# Hypothesis: LVGL rendering ran on the 2 KB system work queue, the same queue
# ZMK's split/BLE work uses. Give the display its own thread and bigger stacks.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
# The dongle was at 0 dBm while the halves transmit at +8 dBm
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Placeholder encoder driver (gives the left half's encoder a sensor slot)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
