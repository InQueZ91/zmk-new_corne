---
# Dongle setup: the dongle is the only central (USB HID + BLE host for both halves).
# Both halves are peripheral-only (CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n; the eyelash_corne_left
# board defaults it to y, so it must be overridden here).
# The old central-left firmware is recoverable: git tag `pre-dongle` / branch `main`.
include:
  # Main dongle firmware, with ZMK Studio (Studio uses the dongle's USB serial port)
  - board: nice_nano_v2
    shield: corne_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: corne_dongle
  # Same dongle firmware with USB serial logging, for debugging only.
  # Debug level is needed: ZMK logs "Disconnected: <addr> (reason N)" at DBG.
  - board: nice_nano_v2
    shield: corne_dongle
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_LOG_LEVEL_DBG=y
    artifact-name: corne_dongle_logging
  - board: eyelash_corne_left
    shield: nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: eyelash_corne_left
  - board: eyelash_corne_right
    shield: nice_view
    artifact-name: eyelash_corne_right
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset_nice_nano_v2
  # Same reset image built for the custom halves' board (identical flash layout expected; unverified)
  - board: eyelash_corne_left
    shield: settings_reset
    artifact-name: settings_reset_eyelash_corne
